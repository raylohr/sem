{% if cell.value is None %}<span class="text-muted" title="{% if cell.unavailable %}Bronveld niet beschikbaar{% else %}Geen waarde{% endif %}">—</span>{% else %}{% if cell.source != 'gsc' %}<a class="inventory-value {% if cell.badge %}status-badge content-type-{{ cell.tone }}{% endif %}" href="{% url 'ui:record' project.id cell.observation.batch_id cell.observation.record_id %}" title="{{ cell.full }} · {{ cell.observation.date|date:'d.m.Y' }}{% if cell.observation.fallback %} · Importdatum; brondatum ontbreekt{% endif %}">{{ cell.text }}</a>{% else %}<span class="inventory-value {% if cell.badge %}status-badge{% endif %}" title="{{ cell.full }} · {{ cell.observation.date|date:'d.m.Y' }}{% if cell.observation.fallback %} · Importdatum; brondatum ontbreekt{% endif %}">{{ cell.text }}</span>{% endif %}{% endif %}
