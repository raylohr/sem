name: sem-prod
x-prod-env: &prod-env
  DB_NAME: sem_prod
  DB_USER: sem_prod_app
  DB_PASSWORD: ${PG_PASSWORD_PROD_APP}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_PROD}
  INTEGRATION_TOKEN_KEY: ${INTEGRATION_TOKEN_KEY_PROD:-}
services:
  web:
    image: ${SEM_PROD_IMAGE:?Use ops/deploy-production.sh or set SEM_PROD_IMAGE}
    environment:
      <<: *prod-env
      TRUST_PROXY_HTTPS: "1"
    ports: !override
      - "127.0.0.1:8002:8000"
  worker:
    image: ${SEM_PROD_IMAGE:?Set SEM_PROD_IMAGE}
    environment: *prod-env
  beat:
    image: ${SEM_PROD_IMAGE:?Set SEM_PROD_IMAGE}
    environment: *prod-env
  migrate:
    image: ${SEM_PROD_IMAGE:?Set SEM_PROD_IMAGE}
    environment:
      <<: *prod-env
      DB_USER: sem_prod_migrate
      DB_PASSWORD: ${PG_PASSWORD_PROD_MIGRATE}
  gateway:
    image: ${SEM_PROD_GATEWAY_IMAGE:?Set SEM_PROD_GATEWAY_IMAGE}
    restart: unless-stopped
    ports:
      - "192.168.178.159:8002:8080"
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
