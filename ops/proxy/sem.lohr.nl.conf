server {
    listen 80;
    listen [::]:80;
    server_name sem.lohr.nl;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://sem.lohr.nl$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sem.lohr.nl;
    ssl_certificate /etc/letsencrypt/live/sem.lohr.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sem.lohr.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # OAuth codes and reset tokens must not appear in proxy logs.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 21m;
    location / {
        proxy_pass http://192.168.178.159:8002;
        proxy_set_header Host sem.lohr.nl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
