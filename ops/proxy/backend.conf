# Only tex-revprox may use the LAN backend. Docker-published ports bypass UFW,
# therefore enforce the source restriction here rather than relying on UFW alone.
server {
    listen 8080 default_server;
    server_name sem.lohr.nl;
    allow 192.168.178.151;
    deny all;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 21m;
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host sem.lohr.nl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
