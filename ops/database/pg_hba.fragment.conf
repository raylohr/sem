# Plaats VÓÓR generieke LAN-regels; behoud bestaande lokale beheerregels.
# Alleen toevoegen nadat SSL/certificaten op PostgreSQL gecontroleerd zijn.
hostssl sem_prod sem_prod_app,sem_prod_migrate 192.168.178.159/32 scram-sha-256
hostssl sem_test sem_test_app,sem_test_migrate 192.168.178.159/32 scram-sha-256
# Voorkom dat generieke bestaande regels SEM-accounts toegang geven elders.
host all sem_prod_app,sem_prod_migrate,sem_test_app,sem_test_migrate 0.0.0.0/0 reject
host all sem_prod_app,sem_prod_migrate,sem_test_app,sem_test_migrate ::/0 reject
