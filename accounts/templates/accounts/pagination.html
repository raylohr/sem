{% if page.has_other_pages %}<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Pagina’s"><span class="small text-muted">Pagina {{ page.number }} van {{ page.paginator.num_pages }}</span><div class="btn-group">{% if page.has_previous %}<a class="btn btn-light btn-sm" href="?q={{ query|urlencode }}&page={{ page.previous_page_number }}">← Vorige</a>{% endif %}{% if page.has_next %}<a class="btn btn-light btn-sm" href="?q={{ query|urlencode }}&page={{ page.next_page_number }}">Volgende →</a>{% endif %}</div></nav>{% endif %}
