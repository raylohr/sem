name: sem-test
x-app: &app
  image: sem-app:local
  restart: unless-stopped
  init: true
  environment: &app-env
    DB_NAME: sem_test
    DB_USER: sem_test_app
    DB_PASSWORD: ${PG_PASSWORD_TEST_APP}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_TEST}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,sem.lohr.nl
    DB_SSLROOTCERT: /app/ops/database/certs/db-pg.crt
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    redis:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 512m
services:
  web:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${SEM_PORT:-8001}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=1
  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    environment:
      <<: *app-env
      DB_USER: sem_test_migrate
      DB_PASSWORD: ${PG_PASSWORD_TEST_MIGRATE}
    command: python manage.py migrate --noinput
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
volumes:
  media:
  redis_data:
